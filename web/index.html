<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="OpenRecall — a multi-modal active-recall study app.">

  <script>
    // The Flutter web engine injects its OWN <meta name="viewport" ...
    // maximum-scale=5.0> at startup and deletes any we declare here. On iOS
    // Safari that lets the browser auto-zoom into the sub-16px login inputs
    // and never zoom back out, and Flutter's gesture layer then swallows the
    // pinch that would recover (docs/web-known-issues.md, issue 7). Re-pin the
    // viewport to a non-zooming value whenever the engine changes it.
    (function () {
      var DESIRED = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, ' +
        'user-scalable=no, viewport-fit=cover';
      function pin() {
        var m = document.querySelector('meta[name="viewport"]');
        if (!m) {
          m = document.createElement('meta');
          m.name = 'viewport';
          document.head.appendChild(m);
        }
        if (m.content !== DESIRED) m.content = DESIRED;
      }
      pin();
      new MutationObserver(pin).observe(
        document.head, { childList: true, subtree: true, attributes: true });
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenRecall">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OpenRecall</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
