name: open_recall
description: "OpenRecall — a multi-modal active-recall study app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  characters: ^1.4.1
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.4.2
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.0
  http: ^1.6.0
  package_info_plus: ^8.1.1
  path: ^1.9.1
  reorderable_grid_view: ^2.2.8
  shared_preferences: ^2.3.3
  sqflite: ^2.4.3
  supabase_flutter: ^2.17.2
  timezone: ^0.9.4
  uuid: ^4.6.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/Figtree-OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/sounds/card_mastered.wav
    - assets/sounds/session_completed.wav
  fonts:
    # Bundled, not fetched at runtime (ui-spec-v3 §1): the app reads its theme
    # before runApp to avoid a flash, and is offline-first — a network font
    # fetch would undo both. Both faces are variable TTFs; Flutter maps
    # FontWeight onto the `wght` axis automatically.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
